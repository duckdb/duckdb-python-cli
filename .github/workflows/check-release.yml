name: Check for new DuckDB releases

on:
  schedule:
    - cron: "0 3 * * *" # every night at 3:00 UTC
  workflow_dispatch: # allow manual trigger
    inputs:
      environment:
        description: "Target PyPI environment"
        required: true
        type: choice
        options:
          - pypi-test
          - pypi
        default: pypi-test

env:
  # Oldest DuckDB line the wrapper supports: 1.4 and older lack the extension_directories setting.
  MINIMUM_VERSION: "1.5.0"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.missing.outputs.versions }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Find stable DuckDB releases not yet published
        id: missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.environment || 'pypi' }}" = "pypi" ]; then
            index="https://pypi.org"
          else
            index="https://test.pypi.org"
          fi
          uv run --no-project scripts/missing_versions.py \
            --minimum "$MINIMUM_VERSION" --index "$index" --github-token "$GH_TOKEN" > missing.txt
          echo "Missing versions:"; cat missing.txt
          versions=$(jq -R -s -c 'split("\n") | map(select(length > 0))' missing.txt)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.versions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.check.outputs.versions) }}
    steps:
      - name: Trigger publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish.yml \
            --repo "${{ github.repository }}" \
            -f version="${{ matrix.version }}" \
            -f environment="${{ inputs.environment || 'pypi' }}"
